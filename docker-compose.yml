services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-quality-trainer
    profiles:
      - train
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: python -m src.train_pipeline

  recipe-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-quality-api
    profiles:
      - deploy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

  recipe-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-quality-streamlit
    profiles:
      - deploy
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    environment:
      - API_URL=http://recipe-api:8000
    depends_on:
      - recipe-api
    command: streamlit run src/streamlit_app.py --server.address 0.0.0.0 --server.port 8501